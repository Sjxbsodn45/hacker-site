<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK NODE</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#020202;
color:#00ff88;
font-family:monospace;
overflow:hidden
}

canvas{
position:fixed;
inset:0;
z-index:-2
}

body:after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:repeating-linear-gradient(
0deg,
rgba(255,255,255,.025) 0px,
rgba(255,255,255,.025) 1px,
transparent 1px,
transparent 4px
);
z-index:10
}

.container{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.panel{
width:100%;
max-width:800px;
padding:30px;
background:rgba(0,0,0,.9);
border:1px solid #00ff88;
box-shadow:0 0 40px #00ff8844
}

.logo{
text-align:center;
font-size:28px;
margin-bottom:25px;
text-shadow:0 0 20px #00ff88
}

input{
width:100%;
padding:15px;
background:#000;
border:1px solid #00ff88;
color:#00ff88;
font-family:monospace;
font-size:16px;
outline:none;
text-align:center
}

button{
width:100%;
margin-top:15px;
padding:15px;
background:transparent;
border:1px solid #00ff88;
color:#00ff88;
font-family:monospace;
font-size:16px;
cursor:pointer
}

button:hover{
background:#00ff88;
color:#000
}

#login{
display:block
}

#system{
display:none
}

#terminal{
min-height:280px;
direction:ltr;
text-align:left;
line-height:2
}

.progress-box{
border:1px solid #00ff88;
height:20px;
padding:3px;
margin-top:20px
}

.progress{
height:100%;
width:0%;
background:#00ff88;
box-shadow:0 0 20px #00ff88;
transition:.2s
}

.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:20px
}

.card{
border:1px solid #00ff88;
padding:15px;
text-align:center
}

.red{
color:#ff2222;
text-shadow:0 0 15px red
}

.final{
display:none;
text-align:center;
font-size:20px;
line-height:2.4
}

@media(max-width:600px){
.panel{padding:20px}
.logo{font-size:22px}
.cards{grid-template-columns:1fr}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">

<div class="panel">

<div class="logo">
☠ BLACK NODE // SECURE ACCESS ☠
</div>

<div id="login">

<p style="text-align:center">
ENTER AUTHORIZED IDENTIFIER
</p>

<input id="name" placeholder="ENTER YOUR NAME">

<button onclick="startSystem()">
⚡ INITIALIZE CONNECTION
</button>

</div>

<div id="system">

<div id="terminal"></div>

<div class="progress-box">
<div class="progress" id="progress"></div>
</div>

<div class="cards">

<div class="card">
NODE<br>
<span id="node">---</span>
</div>

<div class="card">
FIREWALL<br>
<span id="firewall">---</span>
</div>

<div class="card">
TRACE<br>
<span id="trace">---</span>
</div>

<div class="card">
STATUS<br>
<span id="status">---</span>
</div>

</div>

</div>

<div class="final" id="final">

<div class="red">
⚠ SYSTEM ACCESS COMPLETED ⚠
</div>

<br>

TARGET: <span id="target"></span>

<br><br>

😂😂😂😂😂😂😂

<br>

کوروش ایسگا شدی 😂

<br>

هک نشدی داداش...

<br>

فقط یه سایت خفن بود که

<br>

<strong>آقا رضا ساخته 😂🔥</strong>

<br><br>

<span style="font-size:13px">
MADE BY AQA REZA
</span>

</div>

</div>

</div>

<script>

const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

const chars="01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@";
const size=14;
const drops=[];

for(let i=0;i<canvas.width/size;i++){
drops[i]=1
}

function matrix(){

ctx.fillStyle="rgba(0,0,0,.06)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#00ff88";
ctx.font=size+"px monospace";

for(let i=0;i<drops.length;i++){

let text=chars[Math.floor(Math.random()*chars.length)];

ctx.fillText(text,i*size,drops[i]*size);

if(drops[i]*size>canvas.height&&Math.random()>.975){
drops[i]=0
}

drops[i]++
}

}

setInterval(matrix,35);

function startSystem(){

let name=document.getElementById("name").value;

if(!name){
alert("IDENTIFIER REQUIRED");
return
}

document.getElementById("login").style.display="none";
document.getElementById("system").style.display="block";

const terminal=document.getElementById("terminal");
const progress=document.getElementById("progress");

const logs=[
"INITIALIZING BLACK NODE...",
"ESTABLISHING ENCRYPTED CONNECTION...",
"TARGET IDENTIFIED: "+name.toUpperCase(),
"SCANNING SECURITY LAYERS...",
"ANALYZING FIREWALL...",
"BYPASSING PROTECTION...",
"ENCRYPTION STATUS: DECRYPTING...",
"ACCESSING SECURE NODE...",
"DATA STREAM ESTABLISHED...",
"ACCESS GRANTED."
];

let i=0;
let percent=0;

function addLog(){

if(i<logs.length){

let line=document.createElement("div");
line.textContent="> "+logs[i];
terminal.appendChild(line);

i++;

percent+=10;
progress.style.width=percent+"%";

document.getElementById("node").textContent="CONNECTED";
document.getElementById("firewall").textContent="BYPASSED";
document.getElementById("trace").textContent=percent+"%";
document.getElementById("status").textContent="ACTIVE";

setTimeout(addLog,700)

}else{

setTimeout(()=>{

document.getElementById("system").style.display="none";
document.getElementById("final").style.display="block";

document.getElementById("target").textContent=name.toUpperCase();

},2000)

}

}

addLog();

}

</script>

</body>
</html>
