<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

background:linear-gradient(135deg,#ff8dc7,#ff3d7f,#ffb6d9);

}


.heart{

position:absolute;
font-size:25px;
animation:float 6s linear infinite;
opacity:.8;

}


@keyframes float{

0%{
transform:translateY(100vh) scale(0);
}

100%{
transform:translateY(-10vh) scale(1.5);
}

}


.card{

width:350px;

background:white;

padding:30px;

border-radius:30px;

text-align:center;

box-shadow:0 0 40px rgba(0,0,0,.25);

animation:show .8s;

}


@keyframes show{

from{
transform:scale(.5);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}


.horse{

font-size:45px;

animation:jump 1s infinite alternate;

}


@keyframes jump{

from{
transform:translateY(0);
}

to{
transform:translateY(-15px);
}

}


img{

width:220px;
height:220px;
object-fit:cover;

border-radius:50%;

margin:20px;

border:5px solid #ff4f81;

}


#text{

font-size:23px;

font-weight:bold;

color:#ff2770;

min-height:80px;

display:flex;

align-items:center;

justify-content:center;

}


button{

background:#ff4f81;

color:white;

border:none;

padding:15px 40px;

border-radius:40px;

font-size:20px;

cursor:pointer;

box-shadow:0 5px 15px #ffb0c9;

transition:.3s;

}


button:hover{

transform:scale(1.1);

}


.final{

font-size:32px;

animation:pulse 1s infinite;

}


@keyframes pulse{

50%{
transform:scale(1.2);
}

}


</style>

</head>


<body>


<div class="heart">❤️</div>
<div class="heart">💖</div>
<div class="heart">💕</div>
<div class="heart">❤️</div>


<div class="card">


<div class="horse">🐴</div>


<img src="dog.jpg">


<div id="text">
یه چیزی میخوام بهت بگم...
</div>


<button onclick="next()">
بعدی ❤️
</button>


</div>



<script>


const msg=[

"از وقتی اومدی...",
"همه چیز قشنگ‌تر شده...",
"لبخندت قشنگ‌ترین حس دنیاست...",
"بودنت باعث آرامشه...",
"هر روز بیشتر دوستت دارم...",
"خیلی دوست دارم آیدا ❤️"

];


let i=0;


function next(){

i++;


let text=document.getElementById("text");


if(i < msg.length){

text.style.opacity=0;


setTimeout(()=>{

text.innerHTML=msg[i];

text.style.opacity=1;


},300);



if(i==msg.length-1){

text.classList.add("final");

}


}else{

i=msg.length-1;

}


}



</script>


</body>
</html>
