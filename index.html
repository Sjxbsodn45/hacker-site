<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{

background:linear-gradient(135deg,#ff7eb3,#ff4f81,#ff95c8);

height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

}

.card{

width:350px;

background:white;

padding:25px;

border-radius:25px;

text-align:center;

box-shadow:0 0 35px rgba(0,0,0,.25);

animation:pop .7s;

}

@keyframes pop{

from{
transform:scale(.7);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}

.horse{

font-size:35px;

margin-bottom:8px;

animation:horse 1s infinite alternate;

}

@keyframes horse{

from{transform:translateY(0);}
to{transform:translateY(-10px);}

}

img{

width:220px;

border-radius:20px;

margin-bottom:20px;

}

#text{

font-size:23px;

font-weight:bold;

color:#ff2f74;

min-height:70px;

margin-bottom:20px;

transition:.4s;

}

button{

background:#ff4f81;

color:white;

border:none;

padding:14px 35px;

border-radius:30px;

font-size:20px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.08);

background:#ff2f74;

}

.final{

font-size:38px;

color:#ff0059;

animation:love 1s infinite;

}

@keyframes love{

0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(1);}

}

</style>
</head>

<body>

<div class="card">

<div class="horse">🐴</div>

<img src="dog.jpg">

<div id="text">
یه چیزی میخوام بهت بگم...
</div>

<button onclick="next()">بعدی ❤️</button>

</div>

<script>

const msg=[

"از وقتی اومدی...",
"همه چیز قشنگ‌تر شده...",
"لبخندت بهترین حس دنیاست...",
"بودنت آرامشه...",
"هر روز بیشتر دوستت دارم...",
"خیلی دوست دارم آیدا ❤️"

];

let i=0;

function next(){

i++;

if(i<msg.length){

text.innerHTML=msg[i];

if(i==msg.length-1){

text.classList.add("final");

}

}else{

i=msg.length-1;

}

}

</script>

</body>
</html>
